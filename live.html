<!doctype html>
<html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invia al grafico Quest</title>
<style>body{font:18px system-ui;background:#101a29;color:#eef5ff;max-width:520px;margin:10vh auto;padding:24px}input,button{box-sizing:border-box;width:100%;padding:16px;margin:10px 0;border-radius:10px;font:inherit}button{background:#63dfb1;border:0;cursor:pointer}small{color:#b9c8dc}#status{min-height:60px}#reset{background:transparent;color:#ff9b9b;border:2px solid #ff9b9b}</style>
<h1>Grafico live nel Quest</h1><p>Inserisci un valore: ogni invio aggiunge un punto nel tempo.</p>
<form id="form"><label for="value">Valore</label><input id="value" type="number" step="any" min="-1000000000" max="1000000000" required autofocus>
<label for="key">API key (solo se configurata sul server)</label><input id="key" type="password" autocomplete="off">
<button id="send">Invia punto</button><button id="reset" type="button">Reset grafico</button></form><p id="status" role="status">Pronto.</p><small>Ultimi 200 punti, solo in RAM. Conferma di invio = ricezione del server; controlla il grafico nel visore per verificarne la visualizzazione.</small>
<script>
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('send'),status=document.getElementById('status');button.disabled=true;try{const response=await fetch('/api/measurements',{method:'POST',headers:{'Content-Type':'application/json','X-Api-Key':document.getElementById('key').value},body:JSON.stringify({series:'valore',value:Number(document.getElementById('value').value)}),signal:AbortSignal.timeout(10000)});const body=await response.json();if(!response.ok)throw Error(body.error||'Invio fallito');status.textContent=`Punto ${body.id}: ${body.value} ricevuto dal server alle ${new Date(body.time).toLocaleTimeString()}`;}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});

document.getElementById('reset').addEventListener('click',async()=>{if(!confirm('Cancellare tutti i punti del grafico?'))return;const button=document.getElementById('reset'),status=document.getElementById('status');button.disabled=true;try{const response=await fetch('/api/measurements',{method:'DELETE',headers:{'X-Api-Key':document.getElementById('key').value},signal:AbortSignal.timeout(10000)});const body=await response.json();if(!response.ok)throw Error(body.error||'Reset fallito');status.textContent=`Grafico azzerato alle ${new Date().toLocaleTimeString()}`;}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});
</script></html>
